name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: latest
          cache: true
          post-cleanup: true

      - name: Docstring coverage (mojo doc gate)
        run: |
          total=0
          for f in src/net/*.mojo; do
            n=$(pixi run mojo doc --diagnose-missing-doc-strings -o /dev/null "$f" 2>&1 | grep -c warning || true)
            if [ "$n" != "0" ]; then echo "MISSING DOCS: $f ($n)"; total=$((total+n)); fi
          done
          test "$total" = "0"

      - name: Unit tests
        run: pixi run test

      - name: Examples
        run: pixi run example

      - name: Benchmarks (smoke)
        run: pixi run bench-smoke

      - name: Compatibility suite (differential vs CPython sockets)
        run: pixi run compliance

      - name: Check generated compliance badge
        run: git diff --exit-code -- compliance-badge.json

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-report-${{ matrix.os }}
          path: |
            COMPLIANCE.md
            COMPLIANCE.html
            compliance-badge.json

      - name: Package build and installed import smoke
        run: pixi run package-smoke
