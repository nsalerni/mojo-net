# mojo-net: blocking TCP/UDP sockets, DNS, IPv4/IPv6 for Mojo 1.0.
# The conda package is defined in recipe/recipe.yaml.

[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojo-net"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.2.4"
license = "Apache-2.0"
preview = ["pixi-build"]

[tasks]
test = "python3 -B compliance/test_compliance_badge.py && python3 tools/run_tests.py"
example = "mojo run -I src examples/tcp_blocking_echo.mojo && mojo run -I src examples/udp_dns_echo.mojo && mojo run -I src examples/tcp_poller_echo.mojo && mojo run -I src examples/unix_socket_echo.mojo"
compliance = "python3 compliance/run_compliance.py"
bench = "mojo run -I src bench/bench_net.mojo"
bench-smoke = "mojo run -I src bench/bench_net.mojo --smoke"
package-smoke = "python3 tools/test_package.py"

[dependencies]
mojo = ">=1.0.0,<2"
python = ">=3.11"

[package]
name = "mojo-net"
version = "0.2.4"

[package.build]
backend = { name = "pixi-build-rattler-build", version = "0.*" }
